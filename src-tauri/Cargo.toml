[package]
name = "devku"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# Tanpa ini cargo tidak tahu mana yang harus dijalankan saat ada lebih dari
# satu binary (devku untuk aplikasi, devku-cli untuk kontrol headless).
default-run = "devku"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros", "rt-multi-thread", "net", "signal"] }
process-wrap = { version = "10", features = ["tokio1"] }
portable-pty = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Hanya untuk mengunduh PHP/Caddy. Di Windows native-tls memakai schannel
# bawaan sistem, jadi tidak ada OpenSSL atau rustls yang ikut dikompilasi.
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls"] }
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
