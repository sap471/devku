[package]
name = "devku"
version = "0.1.0"
description = "simple dev environment"
authors = ["sap471"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sap471/devku"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devku_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros", "rt-multi-thread", "net", "signal"] }
process-wrap = { version = "10", features = ["tokio1"] }
portable-pty = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Hanya untuk mengunduh PHP/Caddy. Di Windows native-tls memakai schannel
# bawaan sistem, jadi tidak ada OpenSSL atau rustls yang ikut dikompilasi.
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls"] }
sha2 = "0.10"
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
